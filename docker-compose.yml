services:
  tms-automation:
    build:
      context: .
      dockerfile: Dockerfile
    image: tms-automation:all-in-one
    container_name: tms-automation
    restart: unless-stopped
    ports:
      - "3000:80"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      DB_USER: pk
      DB_PASSWORD: pk
      DB_HOST: 127.0.0.1
      DB_NAME: stock
      FRONTEND_SEED_USER: ${FRONTEND_SEED_USER:-admin}
      FRONTEND_SEED_PASSWORD: ${FRONTEND_SEED_PASSWORD:-nepse2026}
      # Keep the browser session signed in across reloads (30 days).
      AUTH_TOKEN_HOURS: ${AUTH_TOKEN_HOURS:-720}
      FRONTEND_ADMIN_USER: ${FRONTEND_ADMIN_USER:-manager}
      FRONTEND_ADMIN_PASSWORD: ${FRONTEND_ADMIN_PASSWORD:-manager2026}
      FRONTEND_NORMAL_USER: ${FRONTEND_NORMAL_USER:-user}
      FRONTEND_NORMAL_PASSWORD: ${FRONTEND_NORMAL_PASSWORD:-user2026}
      ENVIRONMENT: ${ENVIRONMENT:-prod}
      TUNNEL_PROVIDER: ${TUNNEL_PROVIDER:-ngrok}
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
      NGROK_DOMAIN: ${NGROK_DOMAIN:-}
      ZROK_ENV_TOKEN: ${ZROK_ENV_TOKEN:-}
      ZROK_V1_ENV_TOKEN: ${ZROK_V1_ENV_TOKEN:-}
      ZROK_V2_ENV_TOKEN: ${ZROK_V2_ENV_TOKEN:-}
      ZROK_API_ENDPOINT: ${ZROK_API_ENDPOINT:-}
      ZROK_RESERVED_NAME: ${ZROK_RESERVED_NAME:-tmsautomationlive}
      ZROK_STALE_ENV_ZIDS: ${ZROK_STALE_ENV_ZIDS:-}
      ZROK_RESET_SHARES: ${ZROK_RESET_SHARES:-all}
      # Keep the web/API process responsive while a market scan is running.
      # Default 2 workers uses spare cores; raise only after measuring capacity.
      BACKTEST_MAX_WORKERS: ${BACKTEST_MAX_WORKERS:-2}
      BACKTEST_RESERVED_CPUS: ${BACKTEST_RESERVED_CPUS:-1}
      # Mild niceness: yield under load, but use idle CPU for faster scans.
      BACKTEST_WORKER_NICE: ${BACKTEST_WORKER_NICE:-5}
      # Tail discovery is network-bound; modest concurrency makes daily
      # incremental checks fast without increasing strategy replay CPU.
      BACKTEST_REFRESH_FETCH_WORKERS: ${BACKTEST_REFRESH_FETCH_WORKERS:-4}
      # Prevent NumPy/BLAS inside each scan process from creating its own CPU
      # pool and starving normal API/dashboard requests.
      OMP_NUM_THREADS: ${BACKTEST_NUMERIC_THREADS:-1}
      OPENBLAS_NUM_THREADS: ${BACKTEST_NUMERIC_THREADS:-1}
      MKL_NUM_THREADS: ${BACKTEST_NUMERIC_THREADS:-1}
      NUMEXPR_NUM_THREADS: ${BACKTEST_NUMERIC_THREADS:-1}
      BACKTEST_DAILY_REFRESH_ENABLED: ${BACKTEST_DAILY_REFRESH_ENABLED:-true}
    env_file:
      - .env
    volumes:
      - tms_postgres_data:/var/lib/postgresql/data
      - tms_zrok_config:/root/.config/zrok
      - tms_zrok_home:/root/.zrok
      - tms_zrok2_home:/root/.zrok2

volumes:
  tms_postgres_data:
    name: tms-automation_tms_postgres_data
  tms_zrok_config:
    name: tms-automation_tms_zrok_config
  tms_zrok_home:
    name: tms-automation_tms_zrok_home
  tms_zrok2_home:
    name: tms-automation_tms_zrok2_home
